<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend's Day ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            overflow-x: hidden;
            padding: 20px;
        }

        /* Floating Hearts Animation Background */
        .bg-heart {
            position: fixed;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            animation: float 5s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Card Container */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: popUp 1s ease-out;
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Photo Styles */
        .photo-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 15px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.1);
            padding: 12px;
            border-radius: 15px;
        }

        .quotes {
            font-style: italic;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Button & Surprise Message */
        .btn {
            background: #ffffff;
            color: #ff4b2b;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.08);
            background: #ffe6e6;
        }

        .hidden-message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #d63031;
            border-radius: 15px;
            font-weight: bold;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="photo-container">
            <!-- Aapki Photo (Gdrive link ya github image link) -->
            <img src="photo.jpg" alt="Our Picture" class="profile-img">
        </div>

        <h1>Happy Girlfriend's Day princess ⭐ ❤️</h1>
        
        <p>Aaj ka din sirf Girlfriend's Day nahi, balki us insaan ko thank you bolne ka din hai jisse meri life itni khoobsurat ban gayi hai.</p>
        
        <div class="quotes">
            "Main har roz apse aur zyada pyar karne laga hoon." ✨
        </div>

        <button class="btn" onclick="toggleSurprise()">Click for Surprise 🎁</button>

        <div class="hidden-message" id="surprise">
            I Love You So Much! ❤️<br>
            Aap meri life ki sabse best cheez ho! 💖
        </div>
    </div>

    <script>
        // Floating Heart Animation Creator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);

        // Surprise Button Function
        function toggleSurprise() {
            const msg = document.getElementById('surprise');
            if (msg.style.display === 'block') {
                msg.style.display = 'none';
            } else {
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
