<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriends Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5f9e,#ff9a9e,#ffd1dc);
overflow:hidden;
}

.card{
width:90%;
max-width:380px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
border-radius:25px;
padding:25px;
text-align:center;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.25);
animation:zoom 1.5s;
}

@keyframes zoom{
from{
transform:scale(.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.profile{
width:170px;
height:170px;
border-radius:50%;
border:5px solid white;
object-fit:cover;
margin-bottom:20px;
animation:beat 2s infinite;
}

@keyframes beat{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.08);
}
}

h1{
font-size:28px;
margin-bottom:15px;
}

p{
line-height:1.8;
font-size:18px;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff2d55;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
color:#ff1744;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-100px);
opacity:1;
}
}
</style>
</head>

<body>

<div class="card">

<img src="photo.jpg" class="profile">

<h1>❤️ Happy Girlfriends Day ❤️</h1>

<p>
Dear Khushi ❤️<br><br>

Aaj ka din sirf Girlfriends Day nahi,
balki us insaan ko thank you kehne ka din hai
jisne meri life ko itna khoobsurat bana diya.

<br><br>

Main aapse dil se pyaar karta hoon. ❤️

</p>

<button onclick="window.location.href='surprise.html'">
Open My Heart ❤️
</button>
</button>

</div>

<script>

setInterval(()=>{

let h=document.createElement("div");

h.innerHTML="❤️";

h.className="heart";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},6000);

},250);

</script>

</body>
</html>
