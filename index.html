<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriends Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
color:white;
}

.card{
background:rgba(255,255,255,.15);
padding:30px;
border-radius:25px;
backdrop-filter:blur(15px);
box-shadow:0 0 30px rgba(0,0,0,.2);
max-width:350px;
animation:fadeIn 2s;
}

h1{
font-size:32px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.7;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
font-size:18px;
background:#ff2d55;
color:#fff;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

@keyframes fadeIn{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}

.heart{
position:absolute;
color:#ff1744;
font-size:25px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120vh);
opacity:1;
}
}
</style>
</head>

<body>

<div class="card">
<h1>❤️ Happy Girlfriends Day ❤️</h1>

<p>
Dear Khushi ❤️<br><br>

Aaj ka din sirf Girlfriends Day nahi, balki us insaan ko thank you kehne ka din hai jisne meri life ko itna khoobsurat bana diya.<br><br>

Main aapse dil se pyaar karta hoon. ❤️🌹<br><br>

Happy Girlfriends Day, My Forever Person.
</p>

<button onclick="alert('I Love You Forever ❤️🌹')">
Click Here ❤️
</button>

</div>

<script>
function hearts(){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*25)+"px";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},6000);
}
setInterval(hearts,300);
</script>

</body>
</html>
